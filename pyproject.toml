[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisindia4logistics"
version = "1.0.0"
description = "GISIndia4Logistics — Curated Geospatial Data, Multimodal Routing, and Freight Analytics Platform for India"
readme = "README.md"
authors = [
    { name = "GISIndia4Logistics Contributors", email = "info@gisindia4logistics.org" }
]
license = { text = "MIT" }
keywords = ["gis", "logistics", "india", "freight", "routing", "geopandas", "mcp", "fastapi", "geoparquet", "gisindia4logistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "matplotlib>=3.8.0",
    "mapclassify>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]

[project.scripts]
gisindia4logistics = "gisindia4logistics.cli:main"
gis4logistics = "gisindia4logistics.cli:main"

[project.urls]
Homepage = "https://github.com/subhams07/GIS4logistics"
Documentation = "https://github.com/subhams07/GIS4logistics/blob/main/docs/USER_MANUAL.md"
Repository = "https://github.com/subhams07/GIS4logistics.git"
"Bug Tracker" = "https://github.com/subhams07/GIS4logistics/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gisindia4logistics*", "gis4logistics*", "server*", "mcp_server*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.geojson", "*.parquet", "*.csv", "*.gpkg", "*.yaml", "*.yml"]
