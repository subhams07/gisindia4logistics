name: audit-deep
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt tabulate
      - name: Deep data audit (geometry, cross-layer joins, reproducibility)
        run: python scripts/audit/audit_all.py
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deep audit failed (${new Date().toISOString().slice(0,10)})`,
              body: `The weekly deep data audit failed. See the run: ${runUrl}\n\nReproduce locally: \`python scripts/audit/audit_all.py\``,
              labels: ["data-quality"],
            });
