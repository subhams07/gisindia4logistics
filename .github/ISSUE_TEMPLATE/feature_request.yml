name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or analytical need rather than only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data sources and licensing
      description: Identify authoritative, redistributable sources when the request needs new data.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
