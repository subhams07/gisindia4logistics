name: Data quality report
description: Report incorrect, stale, missing, or inconsistent geospatial data
title: "[Data]: "
labels: ["data-quality"]
body:
  - type: input
    id: dataset
    attributes:
      label: Dataset
      description: catalog.yaml dataset ID or repository path
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: Affected records or geography
      description: Include stable IDs such as LGD code, station code, port name, or coordinates where possible.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed versus expected
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Authoritative supporting source
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Analytical impact
      description: Which API, map, model, or derived output may be affected?
