    status is unverified. Source licensing remains unresolved. Official alternative is data.gov.in
    station resources (API key required). state is the current state polygon containing the station
    (scripts/clean/assign_station_states.py; 8,695 of 8,697, the other 2 lie outside India); the base
    table's own label is kept as source_state, and the 189 disagreements, outside points and shared
