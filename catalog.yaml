    NH without a distance limit; all 335 unclassified records have NH labels. Treat NH labels as
    inferred attribution, not trusted plaza identity or passage evidence. Not an official NHAI
    register and not tariff-verified.
- name: Village boundaries, border/NE states (Survey of India via NWDP)
  category: administrative
