- name: Clustered OSM Toll Locations (not an official plaza register)
  category: roads
  description: 1,536 clustered toll plazas across India with NH number, LGD district join, coordinates, and booth counts
  provider: OpenStreetMap contributors + NH network snap
  source_url: https://www.openstreetmap.org
  license: ODbL
  vintage: 2026-08 snapshot
  resolution: national point locations
  access: committed
  path: data/roads/toll_plazas.csv
  fetch_script: scripts/fetch/fetch_toll_plazas.py
  quality_status: verified
  quality_notes: 150m DBSCAN clusters of OSM toll booths; raw input count is not recorded.
    Model labels are 1,100 national_highway, 101 expressway_toll and 335 unclassified highway_toll
