datasets:
- name: India states/UTs boundaries
  category: administrative
  description: 36 states and union territories, LGD state codes, simplified ~100 m
  provider: DataMeet community (based on official sources)
  source_url: https://github.com/datameet/maps
  license: CC BY 4.0
  vintage: current names (incl. Telangana, Ladakh)
  resolution: state
  access: committed
  path: data/administrative/india_states.geojson
  fetch_script: scripts/fetch/fetch_admin_boundaries.py
  quality_status: verified
  quality_notes: 36 features, valid geometries, no unmapped state names; superseded for most uses by india_states_lgd.geojson
    (current, LGD-coded)
- name: India states/UTs boundaries (current, LGD)
  category: administrative
  description: 36 states/UTs from the PAN INDIA LGD-coded dataset
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: Survey of India public data (attributed; indicative boundaries; Geospatial Guidelines 2021; see DATA_LICENSE.md)
  vintage: current
  resolution: state
  access: committed
  path: data/administrative/india_states_lgd.geojson
  fetch_script: scripts/clean/process_panindia_boundaries.py
  quality_status: verified
  quality_notes: 36 features after dropping 4 inter-state disputed slivers; valid geometries
- name: India district boundaries (current, LGD)
  category: administrative
  description: 780 districts with LGD codes — post-2011 districts incl. 2024-25 formations
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: Survey of India public data (attributed; indicative boundaries; Geospatial Guidelines 2021; see DATA_LICENSE.md)
  vintage: current (~780 districts)
  resolution: district
  access: committed
  path: data/administrative/india_districts_lgd.geojson
  fetch_script: scripts/clean/process_panindia_boundaries.py, then scripts/clean/apply_lgd_codes.py
  quality_status: verified
  quality_notes: '780 after dropping 28 disputed slivers. district_code is the official LGD code (776
    districts), mapped by scripts/clean/apply_lgd_codes.py against lgd_districts.csv; the source''s own
    DIST_LGD value (Census 2011 code for older districts, a scheme of its own for newer ones) is kept as
    abdb_district_code, and LGD''s Census 2011 code as census2011_code. No LGD code: Mirpur & Muzaffarabad
    (Jammu and Kashmir; no Census 2011 enumeration), Delhi''s Nazul and Shahdara (absent from LGD after Delhi''s 2025 reorganisation). The layer
    predates the 2025 formations in Ladakh (6), Delhi, Gujarat (Vav-Tharad), Haryana (Hansi) and others
    listed in LGD. Dhule''s source sub-districts carried 598 (Kerala''s Alappuzha in Census numbering),
    corrected in process_panindia_boundaries.py; mojibake names fixed'
- name: India sub-district boundaries (current, LGD)
  category: administrative
  description: 6,636 talukas/tehsils/blocks with LGD codes and type
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: Survey of India public data (attributed; indicative boundaries; Geospatial Guidelines 2021; see DATA_LICENSE.md)
  vintage: current
  resolution: sub-district
  access: committed
  path: data/administrative/india_subdistricts_lgd.gpkg
  fetch_script: scripts/clean/process_panindia_boundaries.py
  quality_status: verified
  quality_notes: '6,636 after dropping 28 disputed slivers and 3 exact duplicate rows; 6,557 non-null
    string sub_district_code values (79 null in source, incl. NOT AVAILABLE and NEW MANDAL) with 6,554
    unique codes; 342 alphanumeric ABDB carveout codes (341 N001..N009 plus raw 07314NOO1) preserved
    verbatim via normalize_sub_district_code / scripts/clean/restore_subdistrict_codes.py; 0 within-state
    duplicates and only 3 genuine raw ABDB cross-state collisions (3606, 6148, 6479 = 6 rows total);
    district_code follows the district layer''s LGD code (source value kept as abdb_district_code);
    mojibake fixed; 22 MB GeoPackage as regular git blob with GeoParquet twin'
- name: India district boundaries (Census 2011)
  category: administrative
  description: 640 districts with census state/district codes and LGD state codes
  provider: DataMeet community (based on official sources)
  source_url: https://github.com/datameet/maps
  license: CC BY 4.0
  vintage: 2011 (current districts ~780 — use GADM or Bhuvan for post-2011 splits)
  resolution: district
  access: committed
  path: data/administrative/india_districts.geojson
  fetch_script: scripts/fetch/fetch_admin_boundaries.py
  quality_status: verified
  quality_notes: 640 features after dropping 1 placeholder; joins 1:1 with census2011_district_key_indicators.csv
    via district_key
- name: LGD district directory (official snapshot)
  category: administrative
  description: Every district in the Local Government Directory with its LGD code and Census 2011 / 2001 codes
  provider: Ministry of Panchayati Raj — Local Government Directory (lgdirectory.gov.in web service)
  source_url: https://lgdirectory.gov.in
  license: Government of India open data (GODL-India); attribute LGD, Ministry of Panchayati Raj
  vintage: snapshot (fetched_on column)
  resolution: district
  access: committed
  path: data/administrative/lgd_districts.csv
  fetch_script: scripts/fetch/fetch_lgd_directory.py
  quality_status: verified
  quality_notes: 790 districts across 36 states/UTs; LGD codes unique nationally (the fetcher refuses to write
    otherwise); census codes 0/blank mean none
- name: LGD sub-district directory & Census 2011 crosswalk (official snapshot)
  category: administrative
  description: Official Local Government Directory sub-district master (7,112 sub-districts across 36 states/UTs and 788/790 LGD districts) with 5-digit Census 2011 sub-district codes
  provider: Ministry of Panchayati Raj — Local Government Directory (lgdirectory.gov.in web service)
  source_url: https://lgdirectory.gov.in/webservices/lgdws/subdistrictList
  license: Government of India open data (GODL-India); attribute LGD, Ministry of Panchayati Raj
  vintage: 2026-11 snapshot
  resolution: sub-district
  access: committed
  path: data/administrative/lgd_subdistricts.csv
  fetch_script: scripts/fetch/fetch_lgd_subdistricts.py
  quality_status: verified
  quality_notes: "7,112 unique LGD sub_district_codes across 36 states/UTs and 788/790 official LGD districts (2 urban-only districts, 315 Kolkata and 482 Mumbai, have 0 sub-districts in LGD). Joins 6,094/6,215 pure-numeric ABDB sub_district_code features (98.05%; 6,094/6,557 = 92.94% of all coded features once Audit Item #18 restores the 342 alphanumeric ABDB carveout codes, vs 6,427/6,557 = 98.02% prior to #18 when truncated carveouts matched parent numeric codes). 5,568/7,112 rows (78.29%) carry a 5-digit zero-padded census2011_code (1,544 blank for post-2011 formations), of which 5,567/5,568 (99.98%) join directly to census2011_subdistrict_key_indicators.csv."
- name: District code crosswalk (SoI ABDB -> LGD)
  category: administrative
  description: Maps each of the 780 boundary-layer districts from its ABDB source code to its LGD code
  provider: derived in this repo
  source_url: https://lgdirectory.gov.in
  license: CC BY 4.0 (derived)
  vintage: current
  resolution: district
  access: committed
  path: data/administrative/district_code_crosswalk.csv
  fetch_script: scripts/clean/apply_lgd_codes.py
  quality_status: verified
