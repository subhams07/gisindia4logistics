- name: Village boundaries (Survey of India — official)
  category: administrative
  description: Official village polygons with LGD codes at all levels (state/district/sub-district/village),
    village category Rural/Urban
  provider: Survey of India
  source_url: https://surveyofindia.gov.in/pages/village-boundary-data-base-of-entire-india
  license: no explicit license stated; free public download — redistributed in good faith with attribution
    (see docs/legal_compliance.md)
  vintage: current (published by SoI; page updated 2026)
  resolution: village
  access: committed (states ≤10 MB; larger states script-generated)
  path: data/administrative/villages/*_soi_villages.geojson
  fetch_script: scripts/fetch/fetch_village_boundaries_soi.py
  quality_status: verified
  quality_notes: 27 states/UTs published (NE + border states absent); LGD-coded at every level; spot-validated
    Sikkim, Pune, Telangana (33), UP (75); TN/Puducherry Subdist column alias fixed; MP Villl_name typo
    fixed; ~1,000 villages have blank names in SoI source (max Uttarakhand 577, Delhi 315) — flagged in
    audit; simplified ~50 m with grid-snap validity pipeline
