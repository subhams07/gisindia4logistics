- name: Clustered OSM Toll Locations (not an official plaza register)
  category: roads
  description: 1,585 clustered toll plazas across India with a stable toll_id, representative OSM element id (osm_node_id), NH number, LGD district join, coordinates, booth counts and a per-row OSM URL
  provider: OpenStreetMap contributors + NH network snap
  source_url: https://www.openstreetmap.org
  license: ODbL
  vintage: 2026-11 Overpass refresh (was 2026-08 snapshot)
  resolution: national point locations
  access: committed
  path: data/roads/toll_plazas.csv
  fetch_script: scripts/fetch/fetch_toll_plazas.py
  quality_status: verified
  quality_notes: "150m clusters of OSM toll booths (1,536 -> 1,585 clusters in the PR #29 refresh).
    Model labels are 1,120 national_highway, 102 expressway_toll and 363 highway_toll
    records, not verified SH/bridge identities. Every row carries toll_id (TPL-0001..TPL-1585; preserved across refreshes by osm_node_id),
    a unique osm_node_id (the representative OSM node, or way when no node exists; 1,550 node / 35 way)
    and source_url = https://www.openstreetmap.org/(node|way)/<osm_node_id>. Missing NH numbers are
    filled from the nearest NH without a distance limit. Treat NH labels as
    inferred attribution, not trusted plaza identity or passage evidence. Not an official NHAI
    register and not tariff-verified. Stage 4 outputs have NOT been regenerated for this file;
    the SHA-256 input provenance in data/analysis/producer_manifest.json is stale until Stage 4 is
    regenerated on Linux."
