datasets:
- name: India states/UTs boundaries
  category: administrative
  description: 36 states and union territories, LGD state codes, simplified ~100 m
  provider: DataMeet community (based on official sources)
  source_url: https://github.com/datameet/maps
  license: CC BY 4.0
  vintage: current names (incl. Telangana, Ladakh)
  resolution: state
  access: committed
  path: data/administrative/india_states.geojson
  fetch_script: scripts/fetch/fetch_admin_boundaries.py
  quality_status: verified
  quality_notes: 36 features, valid geometries, no unmapped state names; superseded for most uses by india_states_lgd.geojson
    (current, LGD-coded)
- name: India states/UTs boundaries (current, LGD)
  category: administrative
  description: 36 states/UTs from the PAN INDIA LGD-coded dataset
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: copyright per metadata; redistribution unresolved, not written permission;
    Geospatial Guidelines 2021 are a policy reference (see DATA_LICENSE.md)
  vintage: current
  resolution: state
  access: committed
  path: data/administrative/india_states_lgd.geojson
  fetch_script: scripts/clean/process_panindia_boundaries.py
  quality_status: verified
  quality_notes: 36 features after dropping 4 inter-state disputed slivers; valid geometries
- name: India district boundaries (current, LGD)
  category: administrative
  description: 780 districts with LGD codes — post-2011 districts incl. 2024-25 formations
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: copyright per metadata; redistribution unresolved, not written permission;
    Geospatial Guidelines 2021 are a policy reference (see DATA_LICENSE.md)
  vintage: current (~780 districts)
  resolution: district
  access: committed
  path: data/administrative/india_districts_lgd.geojson
  fetch_script: scripts/clean/process_panindia_boundaries.py, then scripts/clean/apply_lgd_codes.py
  quality_status: verified
  quality_notes: '780 after dropping 28 disputed slivers. district_code is the official LGD code (776
    districts), mapped by scripts/clean/apply_lgd_codes.py against lgd_districts.csv; the source''s own
    DIST_LGD value (Census 2011 code for older districts, a scheme of its own for newer ones) is kept as
    abdb_district_code, and LGD''s Census 2011 code as census2011_code. No LGD code: Mirpur & Muzaffarabad
    (Jammu and Kashmir; no Census 2011 enumeration), Delhi''s Nazul and Shahdara (absent from LGD after Delhi''s 2025 reorganisation). The layer
    predates the 2025 formations in Ladakh (6), Delhi, Gujarat (Vav-Tharad), Haryana (Hansi) and others
    listed in LGD. Dhule''s source sub-districts carried 598 (Kerala''s Alappuzha in Census numbering),
    corrected in process_panindia_boundaries.py; mojibake names fixed'
- name: India sub-district boundaries (current, LGD)
  category: administrative
  description: 6,636 talukas/tehsils/blocks with LGD codes and type
  provider: Survey of India ABDB (NGDR & UGID) — provider confirmed via official ISO 19115 metadata (docs/metadata/abdb/)
  source_url: https://surveyofindia.gov.in (ABDB; metadata identifiers SOI/ABDB/VECTOR/50000/2025/...)
  license: copyright per metadata; redistribution unresolved, not written permission;
    Geospatial Guidelines 2021 are a policy reference (see DATA_LICENSE.md)
  vintage: current
  resolution: sub-district
  access: committed
  path: data/administrative/india_subdistricts_lgd.gpkg
  fetch_script: scripts/clean/process_panindia_boundaries.py
  quality_status: verified
  quality_notes: 6,636 after dropping 28 disputed slivers and 3 exact duplicate rows; 79 rows have null
    sub-district codes in source; district_code follows the district layer's LGD code (source value kept
    as abdb_district_code); SoI RURAL/URBAN pairs legitimately share one LGD code; mojibake fixed; 22 MB
    GeoPackage as regular git blob
- name: India district boundaries (Census 2011)
  category: administrative
