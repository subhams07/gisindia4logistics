  provider: Survey of India, published by the National Water Informatics Centre (Ministry of Jal Shakti) on the National Water Data Portal
  source_url: https://nwdp.nwic.gov.in/dataset/9bad17f2-9d88-428d-98ad-831ef01ae2e4
  license: Government of India open data, used with attribution to Survey of India and NWIC (see docs/legal_compliance.md)
  vintage: 2025 (NWDP); Census 2011 attributes
  resolution: village
  access: committed (raw zips downloaded by hand into data/raw/nwdp_villages/, gitignored)
  path: data/administrative/villages/*_soi_villages.geojson
  fetch_script: scripts/fetch/fetch_village_boundaries_nwdp.py
  quality_status: verified
  quality_notes: "72,097 villages (Arunachal 5,803; Assam 26,662; HP 20,773; J&K 6,593; Ladakh 250; Meghalaya 6,897; Manipur 2,674;
    Mizoram 881; Nagaland 1,564); village populations sum to the Census 2011 state totals (exact for 5 states, within 0.03% for the
    rest; J&K incl. Ladakh); 634 polygons with code 999999 (forest blocks, data not available) kept with null village_code; same
    simplification/validity pipeline as the SoI portal files. The portal's TLS certificate had expired when fetched, so files were
    downloaded by hand."
- name: Village accessibility analysis (nearest facility)
  category: analysis
  description: Straight-line distance from every village to nearest rail station / ICD / port / air-cargo
    / ICP; per-district summaries with Census-2011 population weighting — ALL 36 states/UTs covered
  provider: derived in this repo (SoI villages x facility layers)
  source_url: null
  license: mixed upstream (see inputs)
  vintage: 2026-08
  resolution: village / district
  access: committed (all states; per-village CSVs + district summaries + india_district_access_summary.csv
    rollup)
  path: data/analysis/
  fetch_script: scripts/analyze/nearest_facility.py --all
  quality_status: verified
  quality_notes: all 36 states at village level (SoI polygons, 9 border/NE states via NWDP); geodesic (WGS84 ellipsoid) distances, EPSG:7755 used only to pick candidates. District identity is the
    current LGD layer (india_districts_lgd), not the village files' older SoI codes/names - each village's
    representative point is assigned to the same-state district polygon containing it (sliver ties by
    largest overlap; 134 coastal/border points outside every same-state polygon take the nearest one,
    flagged district_assignment=nearest); source_district/source_district_code keep the SoI values.
    Summaries have one row per current district (780) keyed by (state, district_code), population joined
    exactly on that key; __STATE__ rows are population-weighted; headline metric - pop-weighted mean
    distance to a rail station 15.9 km, to an ICD 131.2 km across all 36 states
