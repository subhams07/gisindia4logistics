    (4 to an LGD code, 4 with none); no LGD code is used twice; cross-checked against the LGD codes carried by
    the NWDP village files
- name: Census 2011 ↔ LGD crosswalk
  category: administrative
  description: District name/spelling crosswalk and code mapping
  provider: derived in this repo
  source_url: https://lgdirectory.gov.in
  license: CC BY 4.0 (derived)
  vintage: 2011 ↔ current
  resolution: district
  access: committed
  path: data/administrative/census2011_lgd_crosswalk.csv
  fetch_script: scripts/fetch/fetch_admin_boundaries.py
  quality_status: verified
- name: Village boundaries (Survey of India — official)
  category: administrative
  description: Official village polygons with LGD codes at all levels (state/district/sub-district/village),
    village category Rural/Urban
  provider: Survey of India
  source_url: https://surveyofindia.gov.in/pages/village-boundary-data-base-of-entire-india
  license: Survey of India public data (attributed; indicative boundaries; Geospatial Guidelines 2021; see DATA_LICENSE.md)
  vintage: current (published by SoI; page updated 2026)
  resolution: village
  access: committed (all 36 state files, 27 from the SoI portal and 9 via the National Water Data Portal)
  path: data/administrative/villages/*_soi_villages.geojson
  fetch_script: scripts/fetch/fetch_village_boundaries_soi.py
  quality_status: verified
  quality_notes: 27 states/UTs from the SoI village portal (586,151 villages) + the 9 border/NE states from SoI files on the
    National Water Data Portal (72,097 villages with Census 2011 village population; see the NWDP entry); LGD-coded; spot-validated
    Sikkim, Pune, Telangana (33), UP (75); TN/Puducherry Subdist column alias fixed; MP Villl_name typo
    fixed; ~1,000 villages have blank names in SoI source (max Uttarakhand 577, Delhi 315) — flagged in
    audit; simplified ~50 m with grid-snap validity pipeline. One attribute schema across all 36 files
    (scripts/clean/normalize_village_properties.py, audit-enforced) - state is the LGD spelling on every row,
    state_code/district_code/sub_district_code/village_code are text, text values have no line breaks or
    repeated spaces, and "not available" markers (NA, Null, <Null>, Not available) are null; GeoParquet twins in data/administrative/villages_parquet/ carry the same columns. 15 states
    keep a Z = 0.0 coordinate from the source (harmless; geometry bytes are left untouched)
