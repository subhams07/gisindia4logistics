  provider: derived in this repo (IPA throughput x Dijkstra highway travel matrix)
  source_url: null
  license: MIT (code) / GODL-India derived
  vintage: 2026-11
  resolution: district
  access: committed
  path: data/analysis/district_port_hinterland_catchment.csv
  fetch_script: scripts/analyze/stage4_generate.py
  quality_status: verified
  quality_notes: "780 districts: Captive Hinterland 29, Dominant / Mildly Contested 57, Highly Contested / Split Hinterland 690, Island / Isolated 4. Gravity parameters alpha 0.85 / beta 1.65 are UNCALIBRATED (sensitivity table in docs/stage4_drift_linux-2026-10-18-run1.md). Populations from data/demographic/district_population_estimates.csv (MIRPUR, MUZAFFARABAD, NAZUL are area_share estimates)."
