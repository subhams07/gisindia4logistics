# Scoped lint config for this harness directory only (disclosed in the implementation report).
exclude = ["scratch", "results", ".ruff_cache"]

[lint]
# UP031: printf-style formatting is kept deliberately (stylistic only).
ignore = ["UP031"]

[lint.per-file-ignores]
# Test and script code opens many tiny files inline and unpacks (result, proc) pairs it does not always use.
"tests/*" = ["SIM115", "RUF059", "PLW1510", "RUF015", "RUF012", "PLC0206", "PERF102", "SIM117", "S110"]
"scripts/*" = ["SIM115", "RUF059", "PLW1510"]
