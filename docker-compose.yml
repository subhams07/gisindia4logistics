version: '3.8'

services:
  gisindia4logistics-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gisindia4logistics-api-server
    ports:
      - "8000:8000"
    environment:
      - GIS4LOGISTICS_HOST=0.0.0.0
      - GIS4LOGISTICS_PORT=8000
      - GIS4LOGISTICS_CORS_ORIGINS=http://localhost:8000
      - GIS4LOGISTICS_CORS_ALLOW_CREDENTIALS=false
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
